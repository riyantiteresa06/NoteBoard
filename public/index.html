<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NoteBoard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="atas">
    <h1>NoteBoard</h1>
    <nav>
      <a href="/" aria-current="page">Papan</a>
      <a href="/about">Tentang</a>
    </nav>
  </header>

  <main>
    <section class="panel">
      <h2 id="judul-form">Tulis catatan baru</h2>
      <form id="form-catatan" autocomplete="off">
        <div class="baris">
          <div>
            <label for="title">Judul</label>
            <input id="title" name="title" maxlength="60" required>
          </div>
          <div>
            <label for="author">Nama</label>
            <input id="author" name="author" maxlength="40" required>
          </div>
          <div>
            <label for="category">Kategori</label>
            <select id="category" name="category">
              <option>Kuliah</option>
              <option>Tugas</option>
              <option>Ide</option>
              <option selected>Pribadi</option>
            </select>
          </div>
        </div>
        <label for="text">Isi catatan</label>
        <textarea id="text" name="text" rows="3" maxlength="500" required></textarea>
        <div class="aksi">
          <button type="submit" id="btn-simpan">Simpan catatan</button>
          <button type="button" id="btn-batal" class="sekunder" hidden>Batal edit</button>
        </div>
      </form>
      <p id="pesan" class="pesan" role="status"></p>
    </section>

    <section class="alat">
      <input id="cari" type="search" placeholder="Cari judul, isi, atau nama" aria-label="Cari catatan">
      <div id="filter" class="filter" role="group" aria-label="Filter kategori"></div>
    </section>

    <p id="ringkasan" class="ringkasan"></p>
    <section id="papan" class="papan"></section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
